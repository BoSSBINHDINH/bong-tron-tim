<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giấu bóng vào hộp</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    #level {
      margin: 10px;
      font-size: 18px;
    }
    #game {
      position: relative;
      width: 360px;
      height: 120px;
      margin: 0 auto;
    }
    .box {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: gold;
      border: 3px solid #444;
      border-radius: 10px;
      font-size: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
      cursor: pointer;
    }
    #message {
      font-size: 20px;
      margin-top: 20px;
    }
    #startBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🥎 Giấu bóng vào hộp</h1>
  <div id="level">Level: 1</div>
  <div id="game">
    <div class="box" id="box0" onclick="guess(0)">🎁</div>
    <div class="box" id="box1" onclick="guess(1)">🎁</div>
    <div class="box" id="box2" onclick="guess(2)">🎁</div>
  </div>
  <div id="message">Bấm "Bắt đầu" để xem bóng!</div>
  <button id="startBtn" onclick="startGame()">🎬 Bắt đầu</button>

  <script>
    let positions = [0, 120, 240]; // vị trí trái (left) của 3 hộp
    let elements = [document.getElementById("box0"),
                    document.getElementById("box1"),
                    document.getElementById("box2")];
    let ballIndex = 0;
    let boxOrder = [0, 1, 2]; // vị trí logic tương ứng với hộp
    let level = 1;
    let shuffling = false;

    function updateBoxPositions() {
      for (let i = 0; i < 3; i++) {
        elements[i].style.left = positions[boxOrder[i]] + "px";
      }
    }

    function startGame() {
      document.getElementById("message").textContent = "👀 Ghi nhớ vị trí bóng!";
      shuffling = false;
      // Reset thứ tự hộp
      boxOrder = [0, 1, 2];
      updateBoxPositions();
      // Reset biểu tượng
      for (let el of elements) el.innerHTML = "🎁";

      // Gán bóng vào ngẫu nhiên
      ballIndex = Math.floor(Math.random() * 3);
      elements[ballIndex].innerHTML = "🥎";

      // Sau 2s thì ẩn bóng và bắt đầu xáo trộn
      setTimeout(() => {
        for (let el of elements) el.innerHTML = "🎁";
        shuffle();
      }, 2000);
    }

    function shuffle() {
      document.getElementById("message").textContent = "🔄 Đang xáo trộn...";
      let swaps = level * 4;
      let delay = Math.max(600 - level * 50, 150);
      let count = 0;
      shuffling = true;

      const interval = setInterval(() => {
        // Chọn 2 vị trí để đổi chỗ
        let i = Math.floor(Math.random() * 3);
        let j;
        do {
          j = Math.floor(Math.random() * 3);
        } while (i === j);

        // Đổi vị trí logic
        [boxOrder[i], boxOrder[j]] = [boxOrder[j], boxOrder[i]];
        updateBoxPositions();

        // Nếu bóng nằm trong hộp i hoặc j thì cập nhật chỉ số
        if (ballIndex === i) ballIndex = j;
        else if (ballIndex === j) ballIndex = i;

        count++;
        if (count >= swaps) {
          clearInterval(interval);
          document.getElementById("message").textContent = "🤔 Bóng ở đâu? Click 1 hộp!";
          shuffling = false;
        }
      }, delay);
    }

    function guess(index) {
      if (shuffling) return;

      if (index === ballIndex) {
        elements[index].innerHTML = "🥎";
        document.getElementById("message").textContent = "✅ Chính xác! Lên level!";
        level++;
      } else {
        elements[index].innerHTML = "❌";
        elements[ballIndex].innerHTML = "🥎";
        document.getElementById("message").textContent = "❌ Sai rồi! Bắt đầu lại từ level 1.";
        level = 1;
      }

      document.getElementById("level").textContent = "Level: " + level;
    }

    // Vị trí ban đầu
    updateBoxPositions();
  </script>

</body>
</html>
